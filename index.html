<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prompt Generator</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans relative overflow-x-hidden flex items-center justify-center p-4 sm:p-6 md:p-8 py-12">

  <!-- Background Ambient Blobs -->
  <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-purple-300/40 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-300/40 rounded-full blur-[100px] pointer-events-none"></div>
  <div class="fixed top-[40%] left-[50%] translate-x-[-50%] w-[800px] h-[300px] bg-pink-200/30 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative w-full max-w-4xl bg-white/80 backdrop-blur-xl rounded-[2rem] shadow-2xl shadow-indigo-900/10 border border-white overflow-hidden my-auto">
    
    <!-- Header -->
    <div class="bg-gradient-to-br from-violet-600 via-purple-600 to-indigo-700 p-8 text-center text-white relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-full bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10 mix-blend-overlay"></div>
      
      <div class="relative z-10 flex flex-col items-center">
        <div class="bg-white/20 p-3 rounded-2xl backdrop-blur-md mb-4 shadow-lg ring-1 ring-white/30">
          <i data-lucide="sparkles" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold mb-2 tracking-tight">AI Prompt Generator</h1>
        <p class="text-violet-200 text-sm md:text-base mb-6 font-medium max-w-lg mx-auto">
          Ubah video atau gambar Anda menjadi prompt AI yang sangat detail menggunakan kecerdasan model visi canggih.
        </p>
        <div class="inline-block bg-black/20 backdrop-blur-sm px-4 py-1.5 rounded-full border border-white/10">
          <p class="text-white/90 text-xs font-semibold tracking-wider">
            Design by: <span class="text-white font-bold">FAISALRJ.88</span>
          </p>
        </div>
      </div>
    </div>

    <!-- Floating Segmented Tabs -->
    <div class="px-6 pt-8 pb-4">
      <div class="flex p-1.5 bg-slate-100/80 rounded-2xl border border-slate-200/50 shadow-inner" id="tabContainer">
        <button id="tabVideo" class="flex-1 py-3 px-6 text-sm font-bold flex items-center justify-center gap-2 rounded-xl transition-all duration-300 bg-white text-violet-700 shadow-md transform scale-[1.02]">
          <i data-lucide="video" class="w-4 h-4"></i> 1. Video ke Prompt
        </button>
        <button id="tabImage" class="flex-1 py-3 px-6 text-sm font-bold flex items-center justify-center gap-2 rounded-xl transition-all duration-300 text-slate-500 hover:text-slate-700 hover:bg-slate-200/50">
          <i data-lucide="image" class="w-4 h-4"></i> 2. Gambar ke Prompt
        </button>
      </div>
    </div>

    <div class="px-6 md:px-10 pb-10 pt-2 space-y-8">
      
      <!-- Upload Section -->
      <div class="space-y-3">
        <label class="block text-sm font-bold text-slate-700 ml-1">Unggah Media <span class="text-slate-400 font-normal">(Maks 20MB)</span></label>
        
        <div id="dropzone" class="group border-2 border-dashed border-violet-200 hover:border-violet-500 bg-violet-50/30 hover:bg-violet-50/80 rounded-[1.5rem] p-8 text-center cursor-pointer transition-all duration-300 flex flex-col items-center justify-center min-h-[240px] relative overflow-hidden">
          
          <!-- State: Kosong -->
          <div id="uploadPlaceholder" class="z-10 flex flex-col items-center">
            <div class="bg-white p-5 rounded-full shadow-md mb-5 group-hover:scale-110 transition-transform duration-300 group-hover:shadow-violet-200">
              <i data-lucide="upload" class="w-8 h-8 text-violet-500"></i>
            </div>
            <p class="text-slate-800 font-bold text-lg mb-1">Tarik & Lepaskan file di sini</p>
            <p class="text-slate-500 text-sm">atau klik untuk memilih (MP4, WEBM, JPG, PNG)</p>
          </div>

          <!-- State: File Terpilih -->
          <div id="filePreviewContainer" class="relative w-full max-w-sm mx-auto z-10 hidden">
            <!-- Tempat Pratinjau Media -->
            <div id="mediaPreviewWrapper"></div>
            
            <div class="mt-5 inline-flex items-center gap-2 px-4 py-2 bg-white rounded-full shadow-sm text-sm text-violet-600 font-bold group-hover:scale-105 transition-transform">
              <i data-lucide="upload" class="w-4 h-4"></i> Ubah File
            </div>
          </div>

          <input type="file" id="fileInput" accept="video/*,image/*" class="hidden" />
          <div class="absolute inset-0 bg-gradient-to-b from-transparent to-violet-100/50 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
        </div>
      </div>

      <!-- Context Input -->
      <div class="space-y-3">
        <label class="block text-sm font-bold text-slate-700 ml-1">
          Konteks Tambahan <span class="text-slate-400 font-normal">(Opsional)</span>
        </label>
        <input type="text" id="additionalContext" placeholder="Contoh: Fokus pada pergerakan kamera, buat sangat sinematik..." class="w-full px-5 py-4 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-4 focus:ring-violet-500/20 focus:border-violet-500 outline-none transition-all text-slate-700 placeholder:text-slate-400 font-medium" />
      </div>

      <!-- Format Output Selection -->
      <div class="space-y-3">
        <label class="block text-sm font-bold text-slate-700 ml-1">Format Output</label>
        <div class="flex flex-col sm:flex-row gap-4">
          
          <label id="labelFormatText" class="flex items-center gap-3 cursor-pointer p-4 border-2 rounded-xl transition-all duration-200 flex-1 border-violet-600 bg-violet-50 shadow-sm">
            <div id="radioFormatTextOuter" class="w-5 h-5 rounded-full border-2 flex items-center justify-center border-violet-600">
              <div id="radioFormatTextInner" class="w-2.5 h-2.5 bg-violet-600 rounded-full"></div>
            </div>
            <input type="radio" name="formatOutput" value="text" checked class="hidden" />
            <span id="textFormatText" class="text-sm font-bold text-violet-900">Prompt Teks Biasa</span>
          </label>
          
          <label id="labelFormatJson" class="flex items-center gap-3 cursor-pointer p-4 border-2 rounded-xl transition-all duration-200 flex-1 border-slate-200 hover:border-violet-300 hover:bg-slate-50">
            <div id="radioFormatJsonOuter" class="w-5 h-5 rounded-full border-2 flex items-center justify-center border-slate-300">
              <div id="radioFormatJsonInner" class="w-2.5 h-2.5 bg-violet-600 rounded-full hidden"></div>
            </div>
            <input type="radio" name="formatOutput" value="json" class="hidden" />
            <span id="textFormatJson" class="text-sm font-bold text-slate-600">Format JSON Terstruktur</span>
          </label>
        </div>
      </div>

      <!-- Error Message -->
      <div id="errorContainer" class="hidden bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl flex items-start gap-3 text-sm">
        <i data-lucide="alert-circle" class="w-5 h-5 shrink-0 text-red-500"></i>
        <p id="errorText" class="font-medium pt-0.5"></p>
      </div>

      <!-- Action Button -->
      <button id="generateBtn" disabled class="relative w-full py-5 rounded-xl font-extrabold text-white text-lg transition-all duration-300 flex items-center justify-center gap-3 overflow-hidden bg-slate-300 text-slate-500 cursor-not-allowed">
        
        <!-- Loading State Indicator (Hidden by default) -->
        <div id="btnLoadingState" class="absolute inset-0 bg-white/20 animate-pulse hidden"></div>
        
        <!-- Default Content -->
        <div id="btnContentNormal" class="flex items-center gap-3 relative z-10">
          <i data-lucide="wand-2" class="w-6 h-6"></i>
          <span id="btnTextNormal">Buat Prompt Video</span>
        </div>

        <!-- Loading Content -->
        <div id="btnContentLoading" class="hidden items-center gap-3 relative z-10">
          <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
          <span>Menganalisis & Membuat Prompt...</span>
        </div>
      </button>

      <!-- Results Area -->
      <div id="resultArea" class="mt-10 hidden duration-500 transition-opacity">
        <div class="flex items-center justify-between mb-3 px-1">
          <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="sparkles" class="w-5 h-5 text-violet-600"></i> Hasil Prompt
          </h3>
          
          <button id="copyBtn" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all bg-slate-800 text-white hover:bg-slate-700 shadow-md shadow-slate-800/20">
            <div id="iconCopyWrapper"><i data-lucide="copy" class="w-4 h-4"></i></div>
            <span id="copyBtnText">Salin Prompt</span>
          </button>
        </div>
        
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 relative overflow-hidden shadow-2xl">
          <div class="absolute top-4 right-4 flex gap-1.5 opacity-50">
            <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-amber-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-emerald-500/80"></div>
          </div>
          
          <div id="resultTextElement" class="text-slate-300 text-sm md:text-base leading-relaxed whitespace-pre-wrap font-mono max-h-[500px] overflow-y-auto custom-scrollbar mt-6 select-text">
            <!-- Hasil dari AI akan muncul di sini -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Inisialisasi ikon Lucide
    lucide.createIcons();

    // -- KONFIGURASI API KEY --
    const apiKey = ""; // API key akan disediakan otomatis oleh lingkungan eksekusi

    // -- STATE VARIABLES --
    let activeTab = 'videoPrompt';
    let outputFormat = 'text';
    let base64Data = null;
    let mimeType = null;
    let isGenerating = false;
    let generatedTextResult = '';

    // -- DOM ELEMENTS --
    const tabVideo = document.getElementById('tabVideo');
    const tabImage = document.getElementById('tabImage');
    const addContextInput = document.getElementById('additionalContext');
    
    // Drag & Drop / File Upload
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const filePreviewContainer = document.getElementById('filePreviewContainer');
    const mediaPreviewWrapper = document.getElementById('mediaPreviewWrapper');
    
    // Format Radios
    const formatRadios = document.querySelectorAll('input[name="formatOutput"]');
    const labelFormatText = document.getElementById('labelFormatText');
    const labelFormatJson = document.getElementById('labelFormatJson');
    
    // Button & Errors
    const generateBtn = document.getElementById('generateBtn');
    const btnContentNormal = document.getElementById('btnContentNormal');
    const btnContentLoading = document.getElementById('btnContentLoading');
    const btnLoadingState = document.getElementById('btnLoadingState');
    const btnTextNormal = document.getElementById('btnTextNormal');
    const errorContainer = document.getElementById('errorContainer');
    const errorText = document.getElementById('errorText');
    
    // Results
    const resultArea = document.getElementById('resultArea');
    const resultTextElement = document.getElementById('resultTextElement');
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    const iconCopyWrapper = document.getElementById('iconCopyWrapper');

    // -- TABS LOGIC --
    function setActiveTab(tab) {
      activeTab = tab;
      if (tab === 'videoPrompt') {
        tabVideo.className = "flex-1 py-3 px-6 text-sm font-bold flex items-center justify-center gap-2 rounded-xl transition-all duration-300 bg-white text-violet-700 shadow-md transform scale-[1.02]";
        tabImage.className = "flex-1 py-3 px-6 text-sm font-bold flex items-center justify-center gap-2 rounded-xl transition-all duration-300 text-slate-500 hover:text-slate-700 hover:bg-slate-200/50";
        addContextInput.placeholder = "Contoh: Fokus pada pergerakan kamera, buat sangat sinematik...";
        btnTextNormal.textContent = "Buat Prompt Video";
      } else {
        tabImage.className = "flex-1 py-3 px-6 text-sm font-bold flex items-center justify-center gap-2 rounded-xl transition-all duration-300 bg-white text-violet-700 shadow-md transform scale-[1.02]";
        tabVideo.className = "flex-1 py-3 px-6 text-sm font-bold flex items-center justify-center gap-2 rounded-xl transition-all duration-300 text-slate-500 hover:text-slate-700 hover:bg-slate-200/50";
        addContextInput.placeholder = "Contoh: Tekankan pencahayaan, buat seperti hasil foto film 35mm...";
        btnTextNormal.textContent = "Buat Prompt Gambar";
      }
    }

    tabVideo.addEventListener('click', () => setActiveTab('videoPrompt'));
    tabImage.addEventListener('click', () => setActiveTab('imagePrompt'));

    // -- FORMAT OUTPUT LOGIC --
    formatRadios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        outputFormat = e.target.value;
        if (outputFormat === 'text') {
          // Update Text UI
          labelFormatText.className = "flex items-center gap-3 cursor-pointer p-4 border-2 rounded-xl transition-all duration-200 flex-1 border-violet-600 bg-violet-50 shadow-sm";
          document.getElementById('radioFormatTextOuter').classList.add('border-violet-600');
          document.getElementById('radioFormatTextOuter').classList.remove('border-slate-300');
          document.getElementById('radioFormatTextInner').classList.remove('hidden');
          document.getElementById('textFormatText').className = "text-sm font-bold text-violet-900";
          
          // Reset Json UI
          labelFormatJson.className = "flex items-center gap-3 cursor-pointer p-4 border-2 rounded-xl transition-all duration-200 flex-1 border-slate-200 hover:border-violet-300 hover:bg-slate-50";
          document.getElementById('radioFormatJsonOuter').classList.remove('border-violet-600');
          document.getElementById('radioFormatJsonOuter').classList.add('border-slate-300');
          document.getElementById('radioFormatJsonInner').classList.add('hidden');
          document.getElementById('textFormatJson').className = "text-sm font-bold text-slate-600";
        } else {
          // Reset Text UI
          labelFormatText.className = "flex items-center gap-3 cursor-pointer p-4 border-2 rounded-xl transition-all duration-200 flex-1 border-slate-200 hover:border-violet-300 hover:bg-slate-50";
          document.getElementById('radioFormatTextOuter').classList.remove('border-violet-600');
          document.getElementById('radioFormatTextOuter').classList.add('border-slate-300');
          document.getElementById('radioFormatTextInner').classList.add('hidden');
          document.getElementById('textFormatText').className = "text-sm font-bold text-slate-600";
          
          // Update Json UI
          labelFormatJson.className = "flex items-center gap-3 cursor-pointer p-4 border-2 rounded-xl transition-all duration-200 flex-1 border-violet-600 bg-violet-50 shadow-sm";
          document.getElementById('radioFormatJsonOuter').classList.add('border-violet-600');
          document.getElementById('radioFormatJsonOuter').classList.remove('border-slate-300');
          document.getElementById('radioFormatJsonInner').classList.remove('hidden');
          document.getElementById('textFormatJson').className = "text-sm font-bold text-violet-900";
        }
      });
    });

    // -- BUTTON STATE --
    function updateGenerateBtn() {
      if (isGenerating || !base64Data) {
        generateBtn.disabled = true;
        generateBtn.className = "relative w-full py-5 rounded-xl font-extrabold text-white text-lg transition-all duration-300 flex items-center justify-center gap-3 overflow-hidden bg-slate-300 text-slate-500 cursor-not-allowed";
      } else {
        generateBtn.disabled = false;
        generateBtn.className = "relative w-full py-5 rounded-xl font-extrabold text-white text-lg transition-all duration-300 flex items-center justify-center gap-3 overflow-hidden bg-gradient-to-r from-violet-600 via-purple-600 to-indigo-600 hover:from-violet-500 hover:via-purple-500 hover:to-indigo-500 shadow-xl shadow-violet-600/30 hover:shadow-violet-600/50 hover:-translate-y-1";
      }

      if (isGenerating) {
        btnContentNormal.classList.add('hidden');
        btnContentNormal.classList.remove('flex');
        btnContentLoading.classList.remove('hidden');
        btnContentLoading.classList.add('flex');
        btnLoadingState.classList.remove('hidden');
      } else {
        btnContentNormal.classList.remove('hidden');
        btnContentNormal.classList.add('flex');
        btnContentLoading.classList.add('hidden');
        btnContentLoading.classList.remove('flex');
        btnLoadingState.classList.add('hidden');
      }
    }

    // -- FILE UPLOAD LOGIC --
    dropzone.addEventListener('click', () => fileInput.click());
    
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('border-violet-500', 'bg-violet-50/80');
    });
    
    dropzone.addEventListener('dragleave', () => {
      dropzone.classList.remove('border-violet-500', 'bg-violet-50/80');
    });
    
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('border-violet-500', 'bg-violet-50/80');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        handleFile(e.target.files[0]);
      }
    });

    function showError(msg) {
      errorText.textContent = msg;
      errorContainer.classList.remove('hidden');
    }
    function hideError() {
      errorContainer.classList.add('hidden');
      errorText.textContent = '';
    }

    function handleFile(file) {
      hideError();
      if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
        showError('Hanya mendukung format gambar atau video.');
        return;
      }
      if (file.size > 20 * 1024 * 1024) {
        showError('Ukuran file terlalu besar. Maksimal 20MB agar sistem dapat memprosesnya dengan lancar.');
        return;
      }

      mimeType = file.type;
      
      const reader = new FileReader();
      reader.onloadend = () => {
        base64Data = reader.result.split(',')[1];
        
        // Show Preview
        uploadPlaceholder.classList.add('hidden');
        filePreviewContainer.classList.remove('hidden');
        
        const previewClass = "w-full h-auto rounded-xl shadow-lg ring-4 ring-white max-h-64 object-contain bg-black/5";
        if (mimeType.startsWith('video/')) {
          mediaPreviewWrapper.innerHTML = `<video src="${reader.result}" controls class="${previewClass}"></video>`;
        } else {
          mediaPreviewWrapper.innerHTML = `<img src="${reader.result}" alt="Pratinjau" class="${previewClass}" />`;
        }

        // Hide result
        resultArea.classList.add('hidden');
        updateGenerateBtn();
      };
      reader.readAsDataURL(file);
    }

    // -- GENERATE LOGIC --
    async function fetchWithRetry(url, options, retries = 5) {
      const delays = [1000, 2000, 4000, 8000, 16000];
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) {
            throw new Error(`Gagal menghubungi AI (Status: ${response.status})`);
          }
          return await response.json();
        } catch (error) {
          if (i === retries - 1) throw error;
          await new Promise(res => setTimeout(res, delays[i]));
        }
      }
    }

    generateBtn.addEventListener('click', async () => {
      if (!base64Data) {
        showError('Silakan unggah file terlebih dahulu.');
        return;
      }

      isGenerating = true;
      hideError();
      resultArea.classList.add('hidden');
      updateGenerateBtn();

      try {
        const systemInstructionBase = activeTab === 'videoPrompt' 
          ? "Kamu adalah seorang Video Prompt Engineer ahli. Tugasmu adalah menganalisis video (atau gambar referensi) yang diunggah dan membuatkan 'Video Generation Prompt' yang sangat detail dalam BAHASA INGGRIS. Tujuannya agar video tersebut bisa direplikasi ulang menggunakan AI video generator (seperti Sora, Runway, atau Kling). Sertakan detail subjek, pergerakan kamera (camera movement: pan, tilt, zoom), pergerakan subjek, pencahayaan (lighting), gaya visual (visual style), dan suasana (mood)."
          : "Kamu adalah seorang Prompt Engineer ahli. Tugasmu adalah menganalisis gambar yang diunggah dan membuatkan 'Image Generation Prompt' yang sangat detail dan deskriptif dalam BAHASA INGGRIS. Tujuannya agar gambar tersebut bisa direplikasi ulang menggunakan AI image generator (seperti Midjourney/DALL-E). Sertakan detail objek, gaya visual (art style), pencahayaan (lighting), warna, dan sudut kamera (camera angle).";

        const formatInstruction = outputFormat === 'json'
          ? " PENTING: Hasilkan output DALAM FORMAT JSON murni. Buat key yang relevan dengan analisis (seperti 'subject', 'lighting', 'visual_style', dll) dan sertakan satu key wajib bernama 'full_prompt' yang berisi gabungan prompt lengkapnya dalam satu kalimat/paragraf utuh."
          : " PENTING: Hasilkan HANYA isi prompt-nya saja (langsung ke prompt bahasa Inggris), tanpa teks pengantar, tanpa judul, dan tanpa penjelasan apapun.";

        const systemInstruction = systemInstructionBase + formatInstruction;

        let userPrompt = activeTab === 'videoPrompt' 
          ? "Buatkan prompt video mendetail dalam bahasa Inggris berdasarkan file ini."
          : "Buatkan prompt gambar mendetail dalam bahasa Inggris berdasarkan gambar ini.";

        if (addContextInput.value.trim() !== '') {
          userPrompt += ` Konteks tambahan dari pengguna: ${addContextInput.value}`;
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
        
        const payload = {
          contents: [
            {
              role: "user",
              parts: [
                { text: userPrompt },
                {
                  inlineData: {
                    mimeType: mimeType || "image/jpeg",
                    data: base64Data
                  }
                }
              ]
            }
          ],
          systemInstruction: {
            parts: [{ text: systemInstruction }]
          }
        };

        if (outputFormat === 'json') {
          payload.generationConfig = { responseMimeType: "application/json" };
        }

        const result = await fetchWithRetry(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const generatedText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (generatedText) {
          if (outputFormat === 'json') {
            try {
              const jsonObj = JSON.parse(generatedText);
              generatedTextResult = JSON.stringify(jsonObj, null, 2);
            } catch (e) {
              generatedTextResult = generatedText;
            }
          } else {
            generatedTextResult = generatedText;
          }
          
          resultTextElement.textContent = generatedTextResult;
          resultArea.classList.remove('hidden');
          // Scroll perlahan ke arah hasil
          resultArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          
        } else {
          throw new Error("Respon AI kosong atau format tidak sesuai.");
        }

      } catch (err) {
        showError(err.message || "Terjadi kesalahan saat membuat konten.");
      } finally {
        isGenerating = false;
        updateGenerateBtn();
      }
    });

    // -- COPY LOGIC --
    copyBtn.addEventListener('click', () => {
      if (!generatedTextResult) return;
      
      const textArea = document.createElement("textarea");
      textArea.value = generatedTextResult;
      textArea.style.position = "fixed";
      textArea.style.top = "0";
      textArea.style.left = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();

      try {
        const successful = document.execCommand('copy');
        if (successful) {
          // Ubah Button State ke Berhasil
          copyBtn.className = "flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all bg-emerald-500 text-white shadow-md shadow-emerald-500/30";
          iconCopyWrapper.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i>`;
          copyBtnText.textContent = "Tersalin!";
          lucide.createIcons();
          
          setTimeout(() => {
            // Kembalikan Button State ke Normal
            copyBtn.className = "flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-bold transition-all bg-slate-800 text-white hover:bg-slate-700 shadow-md shadow-slate-800/20";
            iconCopyWrapper.innerHTML = `<i data-lucide="copy" class="w-4 h-4"></i>`;
            copyBtnText.textContent = "Salin Prompt";
            lucide.createIcons();
          }, 2000);
        }
      } catch (err) {
        console.error('Gagal menyalin ke papan klip:', err);
      }
      document.body.removeChild(textArea);
    });

  </script>
</body>
</html>
